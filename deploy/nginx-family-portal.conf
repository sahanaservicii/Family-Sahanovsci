# Example nginx reverse proxy for family portal (LAN).
# Put behind HTTPS (self-signed or local CA) for real protection.
server {
    listen 80;
    server_name family.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name family.local;

    ssl_certificate     /etc/family-portal/tls/fullchain.pem;
    ssl_certificate_key /etc/family-portal/tls/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
